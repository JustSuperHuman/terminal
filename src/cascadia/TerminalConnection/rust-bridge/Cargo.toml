[package]
name = "terminal-bridge-rs"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
axum = { version = "0.8.9", features = ["json", "multipart", "query", "ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
if-addrs = "0.14.0"
http = "1.4.0"
json5 = "0.4.1"
parking_lot = "0.12.5"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"
tower-http = { version = "0.6.6", features = ["compression-gzip"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
vt100 = "0.16.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
reqwest = { version = "0.13.1", features = ["json"] }
tempfile = "3.23.0"
